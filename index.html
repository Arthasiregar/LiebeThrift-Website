<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liebe Thrift — Thrift Terkurasi untuk Anak Muda</title>

  <!-- Font dari Google Fonts: Quicksand (heading), Nunito Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============================================
       NAVBAR
       Logo + menu + search bar + wishlist/cart icon
       ============================================ -->
  <header class="navbar">
    <div class="navbar__container">

      <!-- Logo -->
      <a href="index.html" class="navbar__logo">Liebe Thrift</a>

      <!-- Menu (disembunyikan di mobile, diganti hamburger) -->
      <nav class="navbar__menu" id="navbarMenu">
        <ul>
          <li><a href="index.html">Beranda</a></li>
          <li><a href="listing.html">Belanja</a></li>
          <li><a href="wishlist.html">Wishlist</a></li>
        </ul>
      </nav>

      <!-- Search bar -->
      <div class="navbar__search">
        <input type="text" placeholder="Cari brand, kategori, ukuran...">
        <button aria-label="Cari">🔍</button>
      </div>

      <!-- Icon Wishlist & Cart -->
      <div class="navbar__icons">
        <a href="wishlist.html" class="navbar__icon" aria-label="Wishlist">
          ❤️
          <span class="badge">0</span>
        </a>
        <a href="cart.html" class="navbar__icon" aria-label="Keranjang">
          🛒
          <span class="badge">0</span>
        </a>
      </div>

      <!-- Hamburger (khusus mobile) -->
      <button class="navbar__hamburger" id="hamburgerBtn" aria-label="Buka menu">
        ☰
      </button>

    </div>
  </header>

 <!-- ============================================
       HERO SECTION
       Headline + search bar besar + trending chips
       ============================================ -->
  <section class="hero">
    <div class="hero__container">
 
      <div class="hero__content">
        <h1 class="hero__title">Thrift Kece, Kualitas Oke, Kantong Aman 🩷</h1>
        <p class="hero__subtitle">
          Koleksi pakaian bekas terkurasi dengan info ukuran & kondisi yang jujur.
          Ga perlu takut kecewa lagi belanja thrift online.
        </p>
 
        <!-- Search bar besar -->
        <div class="hero__search">
          <input type="text" placeholder="Mau cari apa hari ini? (misal: kemeja flanel)">
          <button>Cari</button>
        </div>
 
        <!-- Trending keywords -->
        <div class="hero__trending">
          <span class="hero__trending-label">Lagi Dicari:</span>
          <div class="chip-list">
            <a href="listing.html?q=jaket-varsity" class="chip">Jaket Varsity</a>
            <a href="listing.html?q=uniqlo" class="chip">Uniqlo</a>
            <a href="listing.html?q=rok-kulit" class="chip">Rok Kulit</a>
            <a href="listing.html?q=y2k" class="chip">Y2K</a>
            <a href="listing.html?q=cardigan-rajut" class="chip">Cardigan Rajut</a>
          </div>
        </div>
      </div>
 
      <div class="hero__image">
        <img src="images/hero-placeholder.png" alt="Model mengenakan pakaian thrift">
      </div>
 
    </div>
  </section>

  <!-- 
    STEP 4 (belum kita isi): Kategori Unggulan akan masuk di sini
  -->

  <!-- 
    STEP 5 (belum kita isi): Product Grid akan masuk di sini
  -->

  <!-- 
    STEP 6 (belum kita isi): Footer akan masuk di sini
  -->

  <script src="js/script.js"></script>
</body>
</html>
